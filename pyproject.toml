[project]
name = "coursework05-drf"
version = "0.1.0"
description = ""
authors = [
    { name = "tray", email = "at-box@mail.ru" }
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "django (==6.1.1)",
    "psycopg2 (>=2.9.12,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "djangorestframework (>=3.18.0,<4.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "coverage (>=7.16.0,<8.0.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "gevent (>=26.8.0,<27.0.0)",
    "isort (==9.0.1)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "isort (>=9.0.0,<10.0.0)",
    "mypy (>=2.2.0,<3.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "django-stubs (>=6.1.0,<7.0.0)",
    "djangorestframework-stubs (>=3.18.0,<4.0.0)",
    "celery-types (>=0.26.0,<0.27.0)",
]

[tool.black]
line-length = 119
exclude = '''
(
  /(
      \.git
  )/
)
'''

[tool.isort]
line_length = 119
profile = "black"

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = ["^venv", ]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.coverage.run]
omit = [
    "*/migrations/*",
    "*/management/commands/*",
    "*/wsgi.py",
    "*/asgi.py",
    "*settings*.py",
    "manage.py",
    "*/apps.py",
]

[tool.coverage.report]
exclude_also = [
    'if __name__ == .__main__.:',
]